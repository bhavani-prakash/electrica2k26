<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ECLECTICA 2K26</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary-orange: #ff8c00;
  --glow-orange: rgba(255, 140, 0, 0.6);
  --bg-dark: #0a0600;
  --accent-blue: #00e5ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background: var(--bg-dark); 
  font-family:'Orbitron',sans-serif;
  color:#f0f0f0;
  overflow-x: hidden;
}

/* ---------- AMBER CIRCUIT BACKGROUND ---------- */
.grid-overlay {
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(var(--glow-orange) 1px, transparent 1px),
    linear-gradient(90deg, var(--glow-orange) 1px, transparent 1px);
  background-size: 60px 60px;
  z-index: 0;
  opacity: 0.15;
  pointer-events: none;
}

/* ---------- NAVBAR ---------- */
.navbar{
  position:fixed;
  top:0;
  width:100%;
  padding:16px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(10, 6, 0, 0.8);
  backdrop-filter:blur(10px);
  z-index:1000;
  border-bottom: 1px solid var(--glow-orange);
}

.nav-logo{
  font-size:20px;
  letter-spacing:2px;
  color: var(--primary-orange);
  text-shadow: 0 0 10px var(--primary-orange);
}

.nav-links a{
  text-decoration:none;
  color: #ffb347;
  font-size:14px;
  margin-left: 28px;
  transition: 0.3s;
}

.nav-links a:hover{
  color: white;
  text-shadow: 0 0 12px var(--primary-orange);
}

/* ---------- HERO SECTION ---------- */
.hero{
  position: relative;
  height:100vh;
  background: radial-gradient(circle at center, #2b1700 0%, #0a0600 85%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  text-align:center;
}

/* ---------- LOGO ANIMATION ---------- */
.hero-logo-container {
  z-index: 20;
  margin-bottom: -40px;
  animation: logo-boot 1.5s ease-out forwards;
}

.hero-logo-container img {
  width: 180px; /* Adjust size based on your logo */
  height: auto;
  filter: drop-shadow(0 0 15px var(--primary-orange));
}

@keyframes logo-boot {
  0% { transform: scale(0.5); opacity: 0; filter: brightness(5) blur(10px); }
  70% { transform: scale(1.1); opacity: 1; filter: brightness(1.5) blur(0px); }
  100% { transform: scale(1); opacity: 1; filter: brightness(1); }
}

/* ---------- SATELLITE ---------- */
.satellite-container {
  position: absolute;
  width: 150px;
  animation: slingshot-orbit 35s ease-in-out infinite;
  filter: drop-shadow(0 0 20px var(--glow-orange)) sepia(1) saturate(5) hue-rotate(-30deg);
}

/* ---------- HERO SVG TEXT ---------- */
svg.hero-svg{
  width:95%;
  max-width:1300px;
  z-index: 10;
}

.pcb-text{
  fill:none;
  stroke: var(--primary-orange);
  stroke-width:2.5; 
  font-size:90px;
  letter-spacing:8px;
  filter: drop-shadow(0 0 10px var(--primary-orange));
  stroke-dasharray: 1000;
  stroke-dashoffset: 1000;
  animation: draw-text 4s 0.5s ease-out forwards;
}

.dept-text{
  fill: var(--accent-blue);
  font-size:24px;
  letter-spacing:4px;
  filter: drop-shadow(0 0 8px var(--accent-blue));
}

@keyframes draw-text { to { stroke-dashoffset: 0; } }

/* ---------- ORANGE ECE BUTTONS ---------- */
.hero-buttons{
  margin-top:40px;
  display:flex;
  gap:25px;
  z-index: 15; 
}

.btn{
  padding:15px 35px;
  border: 1px solid var(--primary-orange);
  background: rgba(255, 140, 0, 0.1);
  color: var(--primary-orange);
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
}

.btn:hover{
  background: var(--primary-orange);
  color: #000;
  box-shadow: 0 0 30px var(--primary-orange);
  transform: translateY(-5px);
}

.btn.primary{
  background: var(--primary-orange);
  color: #000;
}

.trace{
  stroke: var(--primary-orange);
  opacity: 0.4;
  animation: flow 3s linear infinite;
}

@keyframes flow{ to{ stroke-dashoffset:-200; } }

/* ---------- RESPONSIVE ---------- */
@media(max-width:768px){
  .pcb-text{ font-size:40px; }
  .dept-text{ font-size:12px; }
  .hero-logo-container img { width: 120px; }
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="nav-logo">ECLECTICA 2K26</div>
  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">Events</a>
    <a href="#">About</a>
  </div>
</nav>

<section class="hero">
  <div class="grid-overlay"></div>

  <div class="hero-logo-container">
    <img src="your-logo.png" alt="ECE Logo">
  </div>

  <div class="satellite-path">
    <div class="satellite-container">
      <img src="satilite.png" alt="Satellite">
    </div>
  </div>

  <svg class="hero-svg" viewBox="0 0 1400 400">
    <defs>
      <path id="textCurve" d="M50 240 Q700 100 1350 240" />
    </defs>
    <text class="pcb-text">
      <textPath href="#textCurve" startOffset="10%">ECLECTICA 2K26</textPath>
    </text>
    <text x="700" y="310" text-anchor="middle" class="dept-text">
      Department of Electronics and Communication Engineering
    </text>
    
    <path class="trace" fill="none" stroke-width="2" stroke-dasharray="6 10" d="M100 320 H1300" />
    <path class="trace" fill="none" stroke-width="2" stroke-dasharray="6 10" d="M300 320 V350 H1100 V320" />
  </svg>

  <p style="color: #ffb347; margin-top: 10px; opacity: 0.8;">Innovate. Integrate. Inspire.</p>

  <div class="hero-buttons">
    <button class="btn">Explore Events</button>
    <button class="btn primary">Register Now</button>
  </div>
</section>

</body>
</html>
