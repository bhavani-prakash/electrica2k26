<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <title>Spline Responsive</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            position: fixed;
            inset: 0; /* replaces top, left, right, bottom */
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>

<body>
    <iframe 
        src="https://my.spline.design/thebluemarble-FfMPRmQhu3kiQDCLA2njTBJB/"
        allowfullscreen
        loading="lazy">
    </iframe>
</body>
</html>
