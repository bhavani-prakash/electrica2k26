<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ECLECTICA 2K26</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#050505;
  font-family:'Orbitron',sans-serif;
  color:#cfcfcf;
}

/* ---------- NAVBAR ---------- */
.navbar{
  position:fixed;
  top:0;
  width:100%;
  padding:16px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  z-index:1000;
}

.nav-logo{
  font-size:20px;
  letter-spacing:2px;
  color:#8fffd2;
}

.nav-links{
  display:flex;
  gap:28px;
}

.nav-links a{
  text-decoration:none;
  color:#8fffd2;
  font-size:14px;
  transition:0.3s;
}

.nav-links a:hover{
  text-shadow:0 0 8px #00ff9c;
}

/* MOBILE MENU */
.menu-toggle{
  display:none;
}

.menu-icon{
  display:none;
  font-size:24px;
  cursor:pointer;
  color:#8fffd2;
}

/* ---------- HERO ---------- */
.hero{
  height:100vh;
  background:radial-gradient(circle at center, #0a3d2e 0%, #020202 60%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding-top:80px;
  text-align:center;
}

svg{
  width:95%;
  max-width:1400px;
}

/* MAIN TITLE (UNCHANGED) */
.pcb-text{
  fill:none;
  stroke:#00ff9c;
  stroke-width:3;
  font-size:96px;
  letter-spacing:10px;
  filter:drop-shadow(0 0 8px #00ff9c);
}

/* DEPARTMENT TEXT */
.dept-text{
  fill:#00cfff;
  font-size:26px;
  letter-spacing:3px;
  opacity:0.9;
  filter:drop-shadow(0 0 6px #00cfff);
}

/* TAGLINE */
.tagline{
  margin-top:20px;
  max-width:800px;
  font-size:16px;
  color:#cfcfcf;
  opacity:0.85;
}

/* BUTTONS */
.hero-buttons{
  margin-top:30px;
  display:flex;
  gap:20px;
}

.btn{
  padding:14px 28px;
  border:2px solid #00ff9c;
  background:transparent;
  color:#00ff9c;
  font-family:'Orbitron',sans-serif;
  font-size:14px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:#00ff9c;
  color:#020202;
  box-shadow:0 0 20px #00ff9c;
}

.btn.primary{
  background:#00ff9c;
  color:#020202;
}

/* TRACE */
.trace{
  stroke:#00ff9c;
  stroke-width:2;
  fill:none;
  stroke-dasharray:6 10;
  animation:flow 3s linear infinite;
  opacity:0.8;
}

.comp{
  fill:#00ff9c;
  filter:drop-shadow(0 0 6px #00ff9c);
}

@keyframes flow{
  to{ stroke-dashoffset:-200; }
}

/* ---------- RESPONSIVE ---------- */
@media(max-width:768px){
  .pcb-text{
    font-size:48px;
    letter-spacing:4px;
  }

  .dept-text{
    font-size:14px;
    letter-spacing:1px;
  }

  .nav-links{
    position:absolute;
    top:70px;
    right:40px;
    background:#020202;
    flex-direction:column;
    padding:20px;
    display:none;
  }

  .menu-toggle:checked + .menu-icon + .nav-links{
    display:flex;
  }

  .menu-icon{
    display:block;
  }

  .hero-buttons{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-logo">ECLECTICA 2K26</div>

  <input type="checkbox" id="menu" class="menu-toggle">
  <label for="menu" class="menu-icon">☰</label>

  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">Events</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">

<svg viewBox="0 0 1400 400">
  <defs>
    <path id="textCurve" d="M50 220 Q700 80 1350 220" />
  </defs>

  <text class="pcb-text">
    <textPath href="#textCurve" startOffset="10%">
      ECLECTICA 2K26
    </textPath>
  </text>

  <text x="700" y="280" text-anchor="middle" class="dept-text">
    Department of Electronics and Communication Engineering
  </text>

  <!-- PCB TRACES -->
  <path class="trace" d="M80 230 H350" />
  <path class="trace" d="M360 230 V180 H520" />
  <path class="trace" d="M540 180 V230 H720" />
  <path class="trace" d="M740 230 V160 H950" />
  <path class="trace" d="M980 160 V230 H1200" />

  <!-- COMPONENTS -->
  <rect class="comp" x="260" y="222" width="50" height="12" rx="2"/>
  <rect class="comp" x="620" y="222" width="50" height="12" rx="2"/>

  <rect class="comp" x="500" y="195" width="6" height="30"/>
  <rect class="comp" x="515" y="195" width="6" height="30"/>

  <rect class="comp" x="820" y="180" width="80" height="50" rx="4"/>
  <rect class="comp" x="820" y="170" width="6" height="10"/>
  <rect class="comp" x="894" y="170" width="6" height="10"/>
  <rect class="comp" x="820" y="232" width="6" height="10"/>
  <rect class="comp" x="894" y="232" width="6" height="10"/>

  <polygon class="comp" points="1080,215 1100,225 1080,235"/>
  <rect class="comp" x="1100" y="222" width="22" height="12"/>
</svg>

<p class="tagline">
  The ultimate celebration of technology, creativity, and gaming culture.
</p>

<div class="hero-buttons">
  <button class="btn">Explore Events</button>
  <button class="btn primary">Register Now</button>
</div>

</section>
</body>
</html>
