<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ECLECTICA 2K26 | ECE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --amber: #ff8c00;
  --amber-glow: rgba(255, 140, 0, 0.4);
  --cyan: #00e5ff;
  --bg-dark: #050300;
}

*{ margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg-dark);
  font-family: 'Orbitron', sans-serif;
  color: #fff;
  overflow-x: hidden;
}

/* ---------- 1. SILICON TRACE BACKGROUND ---------- */
.background-container {
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 50% 50%, #1a1000 0%, #050300 100%);
  z-index: -1;
}

.grid-overlay {
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(var(--amber-glow) 1px, transparent 1px),
    linear-gradient(90deg, var(--amber-glow) 1px, transparent 1px);
  background-size: 50px 50px;
  opacity: 0.1;
}

/* ---------- 2. NAVBAR ---------- */
.navbar {
  position: fixed;
  top: 0; width: 100%;
  padding: 20px 50px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--amber-glow);
  z-index: 1000;
}

.nav-logo { color: var(--amber); font-weight: 900; letter-spacing: 2px; }
.nav-links a { color: #f0f0f0; text-decoration: none; margin-left: 30px; font-size: 14px; transition: 0.3s; }
.nav-links a:hover { color: var(--amber); text-shadow: 0 0 10px var(--amber); }

/* ---------- 3. HERO SECTION ---------- */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-top: 80px;
  text-align: center;
}

/* Eagle Logo Animation */
.logo-main {
  width: 280px;
  margin-bottom: 20px;
  filter: drop-shadow(0 0 20px var(--amber-glow));
  animation: system-boot 2s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards;
}

@keyframes system-boot {
  0% { transform: scale(0.3) rotate(-10deg); opacity: 0; filter: brightness(5) blur(20px); }
  60% { transform: scale(1.1) rotate(2deg); opacity: 1; filter: brightness(1.5) blur(0px); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; filter: brightness(1); }
}

/* Title Styling */
.title-container { position: relative; }
.hero-title {
  font-size: 85px;
  font-weight: 900;
  color: #fff;
  letter-spacing: 10px;
  text-transform: uppercase;
  margin-bottom: 10px;
  background: linear-gradient(to bottom, #fff, var(--amber));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 15px var(--amber-glow));
}

.hero-subtitle {
  color: var(--cyan);
  font-size: 18px;
  letter-spacing: 4px;
  opacity: 0.9;
  text-transform: uppercase;
}

/* ---------- 4. SATELLITE ---------- */
.satellite {
  position: absolute;
  width: 120px;
  top: 15%;
  right: 10%;
  animation: float 20s linear infinite;
  filter: sepia(100%) saturate(300%) hue-rotate(-30deg) drop-shadow(0 0 20px var(--amber));
}

@keyframes float {
  0% { transform: translate(0, 0) rotate(0deg); }
  50% { transform: translate(-30px, 20px) rotate(5deg); }
  100% { transform: translate(0, 0) rotate(0deg); }
}

/* ---------- 5. BUTTONS ---------- */
.hero-buttons {
  margin-top: 50px;
  display: flex;
  gap: 25px;
}

.btn {
  padding: 18px 45px;
  font-family: 'Orbitron';
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  cursor: pointer;
  transition: 0.4s;
  background: transparent;
}

.btn-amber {
  border: 1px solid var(--amber);
  color: var(--amber);
  clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
}

.btn-cyan {
  border: 1px solid var(--cyan);
  color: var(--cyan);
  clip-path: polygon(0 0, 90% 0, 100% 100%, 10% 100%);
}

.btn:hover {
  transform: translateY(-5px);
  box-shadow: 0 0 30px currentColor;
  background: rgba(255,255,255,0.05);
}

/* Trace lines for the "Electronics" feel */
.trace-line {
    position: absolute;
    height: 1px;
    background: var(--amber);
    opacity: 0.3;
}

</style>
</head>

<body>

<div class="background-container">
    <div class="grid-overlay"></div>
</div>

<nav class="navbar">
  <div class="nav-logo">ECLECTICA 2K26</div>
  <div class="nav-links">
    <a href="#">INTERFACE</a>
    <a href="#">SQUADRON</a>
    <a href="#">UPLINK</a>
  </div>
</nav>

<section class="hero">
  <img src="https://i.ibb.co/L8f3z4K/satellite.png" class="satellite" alt="Satellite">

  <img src="ece-logo.png" class="logo-main" alt="ECE Eagle Logo">

  <div class="title-container">
    <h1 class="hero-title">ECLECTICA 2K26</h1>
    <p class="hero-subtitle">Department of Electronics and Communication Engineering</p>
  </div>

  <div class="hero-buttons">
    <button class="btn btn-amber">Explore Events</button>
    <button class="btn btn-cyan">Register Now</button>
  </div>
</section>

</body>
</html>
