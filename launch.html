<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ECLECTICA 2K26 | Website Launch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #1c2f55, #040b1a, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      overflow: hidden;
      text-align: center;
    }

    /* Soft golden sparkles */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 20% 30%, #d4af37, transparent),
        radial-gradient(2px 2px at 80% 40%, #d4af37, transparent),
        radial-gradient(1.5px 1.5px at 50% 70%, #d4af37, transparent);
      opacity: 0.25;
      animation: shimmer 6s infinite alternate;
    }

    @keyframes shimmer {
      from { opacity: 0.15; }
      to { opacity: 0.3; }
    }

    .launch-container {
      position: relative;
      z-index: 2;
    }

    .fest-name {
      font-family: 'Cinzel', serif;
      font-size: 3.8rem;
      letter-spacing: 4px;
      color: #d4af37;
      text-shadow: 0 0 25px rgba(212, 175, 55, 0.9);
      margin-bottom: 10px;
    }

    .fest-name span {
      color: white;
      letter-spacing: 2px;
    }

    .tagline {
      font-size: 1.2rem;
      margin-bottom: 40px;
      opacity: 0.9;
    }

    .launch-btn {
      padding: 16px 50px;
      font-size: 1.2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, #d4af37, #f6e27a);
      color: #081a3a;
      font-weight: 600;
      letter-spacing: 1.5px;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.9);
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .launch-btn:hover {
      transform: scale(1.12);
      box-shadow: 0 0 55px rgba(212, 175, 55, 1);
    }

    /* Countdown Overlay */
    .countdown {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, #020814, #000);
      display: none;
      justify-content: center;
      align-items: center;
      font-family: 'Cinzel', serif;
      font-size: 9rem;
      font-weight: bold;
      color: #d4af37;
      text-shadow: 0 0 30px rgba(212, 175, 55, 1);
      animation: pulse 1s infinite;
      z-index: 10;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    @media (max-width: 600px) {
      .fest-name {
        font-size: 2.6rem;
      }
      .countdown {
        font-size: 6rem;
      }
    }
  </style>
</head>
<body>

  <div class="launch-container">
    <h1 class="fest-name">ECLECTICA <span>2K26</span></h1>
    <p class="tagline">A Grand Celebration of Innovation & Excellence</p>
    <button class="launch-btn" onclick="startLaunch()">Launch Website 🚀</button>
  </div>

  <div id="countdown" class="countdown">3</div>

  <script>
    let count = 3;
    const countdownEl = document.getElementById("countdown");

    function startLaunch() {
      countdownEl.style.display = "flex";
      countdownEl.textContent = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownEl.textContent = count;
        } else {
          clearInterval(timer);
          countdownEl.textContent = "🎉";

          setTimeout(() => {
            // 🔗 CHANGE THIS TO YOUR ACTUAL WEBSITE URL
            window.location.href = "index.html";
          }, 800);
        }
      }, 1000);
    }
  </script>

</body>
</html>
